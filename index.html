<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CostScope</title>
    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="app/css/style.css" />
    <link rel="manifest" href="app/manifest.webmanifest" />
  </head>
  <body class="bg-light">
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
      <div class="container-fluid">
        <a class="navbar-brand" href="#">CostScope</a>
      </div>
    </nav>

    <main class="container-fluid mt-4">
      <div class="row">
        <!-- Sidebar with Controls -->
        <div class="col-md-3">
          <div class="card">
            <div class="card-header">Controles</div>
            <div class="card-body">
              <h5 class="card-title">Gestión de Datos</h5>
              <div class="d-grid gap-2 mb-3">
                <button id="loadSampleDataButton" class="btn btn-primary">
                  Cargar Datos de Ejemplo
                </button>
                <button id="importButton" class="btn btn-secondary">
                  Importar Archivo
                </button>
              </div>
              <h5 class="card-title">Procesamiento</h5>
              <div class="d-grid gap-2">
                <button id="runAllocationButton" class="btn btn-success">
                  Ejecutar Asignación
                </button>
                <button id="calculateButton" class="btn btn-info">
                  Calcular (Worker)
                </button>
              </div>
            </div>
          </div>
        </div>

        <!-- Main Content Area -->
        <div class="col-md-9">
          <div id="root">
            <!-- App content will be rendered here by the router -->
            <h2>Panel Principal</h2>
            <p>
              La vista principal de la aplicación, con gráficos y tablas, se
              mostrará aquí.
            </p>
          </div>
        </div>
      </div>
    </main>

    <script type="module" src="app/js/main.js"></script>
    <!-- Bootstrap JS Bundle -->
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
